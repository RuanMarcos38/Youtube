name: EasyPanel Runtime Probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report probe pending
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"diagnostics/easypanel-runtime\",\"description\":\"Reading shortsia runtime logs\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Read ShortsFlow runtime logs
        shell: bash
        env:
          EASYPANEL_API_KEY: ${{ secrets.EASYPANEL_API_KEY }}
          EASYPANEL_URL: https://ke4n49.easypanel.host
        run: |
          set -euo pipefail
          test -n "$EASYPANEL_API_KEY"
          node <<'JS'
          const base = process.env.EASYPANEL_URL.replace(/^http/, 'ws').replace(/\/$/, '');
          const url = new URL(base + '/ws/serviceLogs');
          url.searchParams.set('token', process.env.EASYPANEL_API_KEY);
          url.searchParams.set('service', 'r2rmarketingdigital_shortsia');
          url.searchParams.set('compose', 'false');

          const ws = new WebSocket(url.toString());
          let buffer = '';
          let finished = false;
          let idle;
          const hard = setTimeout(() => finish(buffer ? 0 : 1), 12000);

          function finish(code) {
            if (finished) return;
            finished = true;
            clearTimeout(hard);
            clearTimeout(idle);
            try { ws.close(); } catch {}
            const lines = buffer.replace(/\r/g, '').split('\n').filter(Boolean);
            const needles = [
              'traceback', 'error', 'exception', 'operationalerror', 'sqlite', 'database',
              'uvicorn', 'backend', 'supervisor', 'exited', 'fatal', 'no such column',
              'locked', 'modulenotfound', 'importerror', 'permission denied'
            ];
            const interesting = lines.filter(line => needles.some(word => line.toLowerCase().includes(word)));
            console.log('--- SHORTSFLOW RUNTIME DIAGNOSTICS ---');
            console.log((interesting.length ? interesting : lines.slice(-250)).slice(-300).join('\n'));
            process.exit(code);
          }

          ws.addEventListener('message', event => {
            let text = String(event.data ?? '');
            try {
              const parsed = JSON.parse(text);
              if (typeof parsed?.output === 'string') text = parsed.output;
            } catch {}
            buffer += text;
            clearTimeout(idle);
            idle = setTimeout(() => finish(0), 1500);
          });
          ws.addEventListener('error', () => finish(1));
          ws.addEventListener('close', () => finish(buffer ? 0 : 1));
          JS

      - name: Report probe success
        if: ${{ success() }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"diagnostics/easypanel-runtime\",\"description\":\"Runtime logs captured\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Report probe failure
        if: ${{ failure() }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"diagnostics/easypanel-runtime\",\"description\":\"Could not capture runtime logs\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
