name: Repair ShortsFlow Production Login

on:
  push:
    branches: [main]
    paths:
      - backend/app/services/bootstrap.py
      - .github/workflows/repair-production-login.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: repair-shortsflow-production-login
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate EasyPanel secret
        shell: bash
        env:
          EASYPANEL_API_KEY: ${{ secrets.EASYPANEL_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$EASYPANEL_API_KEY"

      - name: Repair only ShortsFlow production environment
        shell: bash
        env:
          EASYPANEL_API_KEY: ${{ secrets.EASYPANEL_API_KEY }}
          EASYPANEL_URL: https://ke4n49.easypanel.host
          EASYPANEL_PROJECT: r2rmarketingdigital
          EASYPANEL_SERVICE: shortsia
        run: |
          set -euo pipefail
          umask 077

          curl -fsS --max-time 30 --get \
            -H "Authorization: Bearer $EASYPANEL_API_KEY" \
            -H "Accept: application/json" \
            --data-urlencode "projectName=$EASYPANEL_PROJECT" \
            --data-urlencode "serviceName=$EASYPANEL_SERVICE" \
            "$EASYPANEL_URL/api/inspectAppService" > /tmp/shortsflow-app.json

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit

          data = json.loads(Path('/tmp/shortsflow-app.json').read_text(encoding='utf-8'))

          def find_env(node):
              if isinstance(node, dict):
                  for preferred in ('env', 'environment'):
                      value = node.get(preferred)
                      if isinstance(value, str) and ('DATABASE_URL=' in value or 'ADMIN_BOOTSTRAP_EMAIL=' in value):
                          return value
                  for value in node.values():
                      found = find_env(value)
                      if found is not None:
                          return found
              elif isinstance(node, list):
                  for value in node:
                      found = find_env(value)
                      if found is not None:
                          return found
              return None

          def find_dotenv_path(node):
              if isinstance(node, dict):
                  value = node.get('dotEnvPath')
                  if isinstance(value, str) and value.strip():
                      return value.strip()
                  for value in node.values():
                      found = find_dotenv_path(value)
                      if found:
                          return found
              elif isinstance(node, list):
                  for value in node:
                      found = find_dotenv_path(value)
                      if found:
                          return found
              return None

          env_text = find_env(data)
          if env_text is None:
              raise SystemExit('EasyPanel app environment was not found; refusing to modify any other configuration.')

          blocked = {'schema', 'pgbouncer', 'connection_limit', 'pool_timeout'}
          admin_hash = 'pbkdf2_sha256$260000$jbqldmkFLidGVBbNUVAjQw==$_L_rs0Q7Dq-tAtwiFTDu81SL4Y6d_HXM2IOmf4NNItI='
          admin_email = 'admin@r2rmarketingdigital.com.br'

          lines = env_text.splitlines()
          output = []
          found_db = False
          found_admin_email = False
          found_admin_hash = False
          removed = []

          for line in lines:
              if line.startswith('DATABASE_URL='):
                  found_db = True
                  raw = line.split('=', 1)[1].strip()
                  parts = urlsplit(raw)
                  if parts.scheme not in {'postgres', 'postgresql', 'postgresql+psycopg'}:
                      raise SystemExit('DATABASE_URL is not a PostgreSQL URL; refusing automatic repair.')
                  kept = []
                  for key, value in parse_qsl(parts.query, keep_blank_values=True):
                      if key.lower() in blocked:
                          removed.append(key.lower())
                      else:
                          kept.append((key, value))
                  repaired = urlunsplit((parts.scheme, parts.netloc, parts.path, urlencode(kept), parts.fragment))
                  output.append('DATABASE_URL=' + repaired)
              elif line.startswith('ADMIN_BOOTSTRAP_EMAIL='):
                  found_admin_email = True
                  output.append('ADMIN_BOOTSTRAP_EMAIL=' + admin_email)
              elif line.startswith('ADMIN_BOOTSTRAP_PASSWORD_HASH='):
                  found_admin_hash = True
                  output.append('ADMIN_BOOTSTRAP_PASSWORD_HASH=' + admin_hash)
              else:
                  output.append(line)

          if not found_db:
              raise SystemExit('DATABASE_URL was not found in ShortsFlow environment; refusing unrelated changes.')
          if not found_admin_email:
              output.append('ADMIN_BOOTSTRAP_EMAIL=' + admin_email)
          if not found_admin_hash:
              output.append('ADMIN_BOOTSTRAP_PASSWORD_HASH=' + admin_hash)

          payload = {
              'projectName': os.environ['EASYPANEL_PROJECT'],
              'serviceName': os.environ['EASYPANEL_SERVICE'],
              'env': '\n'.join(output).rstrip() + '\n',
          }
          dot_env_path = find_dotenv_path(data)
          if dot_env_path:
              payload['dotEnvPath'] = dot_env_path

          Path('/tmp/update-shortsflow-env.json').write_text(json.dumps(payload), encoding='utf-8')
          print('ShortsFlow environment prepared safely.')
          if removed:
              print('Removed incompatible PostgreSQL client parameters: ' + ', '.join(sorted(set(removed))))
          else:
              print('DATABASE_URL already had no incompatible client parameters.')
          print('Admin bootstrap credential is pinned to the configured administrator account without exposing the password.')
          PY

          curl -fsS --max-time 30 -X POST \
            -H "Authorization: Bearer $EASYPANEL_API_KEY" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            "$EASYPANEL_URL/api/updateAppEnv" \
            --data-binary @/tmp/update-shortsflow-env.json > /dev/null

          rm -f /tmp/update-shortsflow-env.json /tmp/shortsflow-app.json
          echo "EasyPanel environment updated only for r2rmarketingdigital/shortsia."

      - name: Redeploy ShortsFlow
        shell: bash
        env:
          EASYPANEL_API_KEY: ${{ secrets.EASYPANEL_API_KEY }}
          EASYPANEL_URL: https://ke4n49.easypanel.host
        run: |
          set -euo pipefail
          curl -fsS --max-time 600 -X POST \
            -H "Authorization: Bearer $EASYPANEL_API_KEY" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            "$EASYPANEL_URL/api/deployAppService" \
            -d '{"projectName":"r2rmarketingdigital","serviceName":"shortsia","forceRebuild":true}' \
            > /dev/null
          echo "EasyPanel accepted the repaired ShortsFlow deployment."

      - name: Wait for API recovery
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code=$(curl -sS --max-time 10 -o /tmp/health.json -w '%{http_code}' https://shorts.r2rmarketingdigital.com.br/api/health || true)
            if [ "$code" = "200" ]; then
              python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/health.json').read_text(encoding='utf-8'))
          if data.get('status') != 'ok':
              raise SystemExit('Health endpoint returned 200 but status is not ok')
          print('ShortsFlow backend is online.')
          PY
              exit 0
            fi
            echo "Waiting for backend recovery ($i/30, HTTP ${code:-unreachable})"
            sleep 10
          done
          echo "Backend did not recover in time."
          exit 1

      - name: Verify login API no longer returns 500
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 20 -o /tmp/login.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke-test-do-not-create@example.com","password":"invalid-smoke-password"}' \
            https://shorts.r2rmarketingdigital.com.br/api/auth/login)
          if [ "$code" != "401" ]; then
            echo "Login endpoint returned HTTP $code instead of 401 for invalid credentials."
            exit 1
          fi
          echo "Login API is operational and no longer returning HTTP 500."

      - name: Verify frontend
        shell: bash
        run: curl -fsSI --max-time 20 https://shorts.r2rmarketingdigital.com.br/
