name: Deploy EasyPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: deploy-easypanel-shortsia
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Report deployment pending
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"deploy/easypanel\",\"description\":\"Deploying shortsia to EasyPanel\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Validate EasyPanel credentials
        shell: bash
        env:
          EASYPANEL_API_KEY: ${{ secrets.EASYPANEL_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$EASYPANEL_API_KEY"

      - name: Verify exact EasyPanel target
        shell: bash
        env:
          EASYPANEL_API_KEY: ${{ secrets.EASYPANEL_API_KEY }}
          EASYPANEL_URL: https://ke4n49.easypanel.host
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 --get \
            -H "Authorization: Bearer $EASYPANEL_API_KEY" \
            -H "Accept: application/json" \
            --data-urlencode "projectName=r2rmarketingdigital" \
            --data-urlencode "serviceName=shortsia" \
            "$EASYPANEL_URL/api/inspectAppService" > /tmp/easypanel-app.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/easypanel-app.json').read_text(encoding='utf-8'))
          if data is None:
              raise SystemExit('Target EasyPanel app r2rmarketingdigital/shortsia was not found')
          print('EasyPanel authenticated; exact ShortsFlow service located.')
          PY

      - name: Ensure custom domain only
        shell: bash
        env:
          EASYPANEL_API_KEY: ${{ secrets.EASYPANEL_API_KEY }}
          EASYPANEL_URL: https://ke4n49.easypanel.host
          EASYPANEL_PROJECT: r2rmarketingdigital
          EASYPANEL_SERVICE: shortsia
          EASYPANEL_DOMAIN: shorts.r2rmarketingdigital.com.br
          EASYPANEL_DOMAIN_PORT: '3000'
        run: python3 deploy/ensure_easypanel_domain.py

      - name: Deploy target app without mutating environment
        shell: bash
        env:
          EASYPANEL_API_KEY: ${{ secrets.EASYPANEL_API_KEY }}
          EASYPANEL_URL: https://ke4n49.easypanel.host
        run: |
          set -euo pipefail
          curl -fsS --max-time 600 -X POST \
            -H "Authorization: Bearer $EASYPANEL_API_KEY" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            "$EASYPANEL_URL/api/deployAppService" \
            -d '{"projectName":"r2rmarketingdigital","serviceName":"shortsia","forceRebuild":true}' \
            > /tmp/easypanel-deploy.json
          echo "EasyPanel accepted the ShortsFlow deployment request. Existing environment/secrets were preserved."

      - name: Wait for healthy backend
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            if curl -fsS --max-time 12 https://shorts.r2rmarketingdigital.com.br/api/health > /tmp/health.json; then
              if python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/health.json').read_text(encoding='utf-8'))
          c = data.get('checks') or {}
          # Real YouTube download may be independently degraded by IP/session
          # reputation. Deployment readiness is based on internal runtime.
          ok = (
              c.get('worker_alive') is True
              and c.get('ffmpeg_available') is True
              and c.get('ffprobe_available') is True
              and c.get('ytdlp_js_runtime_available') is True
              and c.get('ytdlp_ejs_available') is True
          )
          raise SystemExit(0 if ok else 1)
          PY
              then
                echo "Backend and worker are healthy."
                exit 0
              fi
            fi
            echo "Waiting for ShortsFlow runtime... attempt $i/36"
            sleep 10
          done
          echo "ShortsFlow runtime did not become healthy in time."
          exit 1

      - name: Verify authentication contract
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 20 -o /tmp/login.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke-test-do-not-create@example.com","password":"invalid-smoke-password"}' \
            https://shorts.r2rmarketingdigital.com.br/api/auth/login)
          test "$code" = "401"
          for path in /api/youtube/oauth/status /api/youtube/oauth/start; do
            code=$(curl -sS --max-time 20 -o /tmp/oauth.json -w '%{http_code}' "https://shorts.r2rmarketingdigital.com.br${path}")
            test "$code" = "401"
          done
          echo "Login and protected OAuth routes are responding correctly."

      - name: Verify frontend and legal pages
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            https://shorts.r2rmarketingdigital.com.br/ \
            https://shorts.r2rmarketingdigital.com.br/Logo.png \
            https://shorts.r2rmarketingdigital.com.br/privacidade \
            https://shorts.r2rmarketingdigital.com.br/termos \
            https://shorts.r2rmarketingdigital.com.br/exclusao-de-dados
          do
            curl -fsS -L --max-time 20 -o /dev/null "$url"
          done

      - name: Diagnose exact service on failure
        if: ${{ failure() }}
        continue-on-error: true
        shell: bash
        env:
          EASYPANEL_API_KEY: ${{ secrets.EASYPANEL_API_KEY }}
          EASYPANEL_URL: https://ke4n49.easypanel.host
        run: |
          curl -sS --max-time 30 --get \
            -H "Authorization: Bearer $EASYPANEL_API_KEY" \
            -H "Accept: application/json" \
            --data-urlencode "projectName=r2rmarketingdigital" \
            --data-urlencode "serviceName=shortsia" \
            "$EASYPANEL_URL/api/getServiceError" | head -c 12000 || true

      - name: Report deployment success
        if: ${{ success() }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"deploy/easypanel\",\"description\":\"EasyPanel deploy and runtime checks passed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Report deployment failure
        if: ${{ failure() || cancelled() }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"deploy/easypanel\",\"description\":\"EasyPanel deployment or runtime validation failed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
