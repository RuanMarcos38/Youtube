name: Deploy EasyPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: deploy-easypanel-shortsia
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Report deployment pending
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"deploy/easypanel\",\"description\":\"Deploying shortsia to EasyPanel\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Check required secret
        shell: bash
        env:
          EASYPANEL_API_KEY: ${{ secrets.EASYPANEL_API_KEY }}
        run: |
          if [ -z "$EASYPANEL_API_KEY" ]; then
            echo "EASYPANEL_API_KEY secret is not configured."
            exit 1
          fi

      - name: Verify EasyPanel API and target app
        shell: bash
        env:
          EASYPANEL_API_KEY: ${{ secrets.EASYPANEL_API_KEY }}
          EASYPANEL_URL: https://ke4n49.easypanel.host
        run: |
          curl -fsS --max-time 30 --get \
            -H "Authorization: Bearer $EASYPANEL_API_KEY" \
            -H "Accept: application/json" \
            --data-urlencode "projectName=r2rmarketingdigital" \
            --data-urlencode "serviceName=shortsia" \
            "$EASYPANEL_URL/api/inspectAppService" \
            > /tmp/easypanel-app.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/easypanel-app.json').read_text(encoding='utf-8'))
          if data is None:
              raise SystemExit('Target EasyPanel app was not found')
          print('EasyPanel API authenticated; target app shortsia exists.')
          PY

      - name: Ensure custom domain
        shell: bash
        env:
          EASYPANEL_API_KEY: ${{ secrets.EASYPANEL_API_KEY }}
          EASYPANEL_URL: https://ke4n49.easypanel.host
          EASYPANEL_PROJECT: r2rmarketingdigital
          EASYPANEL_SERVICE: shortsia
          EASYPANEL_DOMAIN: shorts.r2rmarketingdigital.com.br
          EASYPANEL_DOMAIN_PORT: '3000'
        run: python3 deploy/ensure_easypanel_domain.py

      - name: Deploy target app
        shell: bash
        env:
          EASYPANEL_API_KEY: ${{ secrets.EASYPANEL_API_KEY }}
          EASYPANEL_URL: https://ke4n49.easypanel.host
        run: |
          curl -fsS --max-time 60 -X POST \
            -H "Authorization: Bearer $EASYPANEL_API_KEY" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            "$EASYPANEL_URL/api/deployAppService" \
            -d '{"projectName":"r2rmarketingdigital","serviceName":"shortsia","forceRebuild":false}' \
            > /tmp/easypanel-deploy.json
          echo "EasyPanel accepted the shortsia deployment request."

      - name: Wait for application
        shell: bash
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 https://shorts.r2rmarketingdigital.com.br/api/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            echo "Waiting for healthcheck... attempt $i/30"
            sleep 10
          done
          echo "Healthcheck did not become available in time."
          exit 1

      - name: Check frontend
        shell: bash
        run: |
          curl -fsSI --max-time 15 https://shorts.r2rmarketingdigital.com.br/

      - name: Report deployment success
        if: ${{ success() }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"deploy/easypanel\",\"description\":\"EasyPanel deploy and public healthcheck passed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Report deployment failure
        if: ${{ failure() || cancelled() }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"deploy/easypanel\",\"description\":\"EasyPanel deployment failed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
