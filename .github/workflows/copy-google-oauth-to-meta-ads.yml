name: Discover Gestao Ads EasyPanel Target

on:
  push:
    branches: [ops/copy-google-oauth-to-meta-ads]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EASYPANEL_URL: https://ke4n49.easypanel.host
      EASYPANEL_API_KEY: ${{ secrets.EASYPANEL_API_KEY }}
    steps:
      - name: List project and service names only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EASYPANEL_API_KEY:-}"
          status="$(curl -sS --max-time 30 -o /tmp/services.json -w '%{http_code}' \
            -H "Authorization: Bearer $EASYPANEL_API_KEY" \
            -H "Accept: application/json" \
            "$EASYPANEL_URL/api/listProjectsAndServices")"
          test "$status" = "200"
          python3 - <<'PY'
          import json, pathlib
          data=json.loads(pathlib.Path('/tmp/services.json').read_text(encoding='utf-8'))
          rows=[]
          def walk(node, project=None):
              if isinstance(node, dict):
                  p=project
                  for key in ('projectName','project','name'):
                      v=node.get(key)
                      if key in ('projectName','project') and isinstance(v,str): p=v
                  service=None
                  for key in ('serviceName','service'):
                      v=node.get(key)
                      if isinstance(v,str): service=v
                  if service:
                      rows.append((p or '?',service))
                  for v in node.values(): walk(v,p)
              elif isinstance(node,list):
                  for v in node: walk(v,project)
          walk(data)
          seen=set()
          for p,s in rows:
              if (p,s) in seen: continue
              seen.add((p,s))
              print(f'PROJECT={p} SERVICE={s}')
          if not seen:
              # fallback sanitized traversal: print only scalar values under keys that look like names
              def names(node,path=''):
                  if isinstance(node,dict):
                      for k,v in node.items():
                          if isinstance(v,str) and k.lower() in {'name','projectname','servicename','project','service'}:
                              print(f'{path}/{k}={v}')
                          else: names(v,path+'/'+k)
                  elif isinstance(node,list):
                      for i,v in enumerate(node): names(v,path+f'[{i}]')
              names(data)
          PY
          rm -f /tmp/services.json
