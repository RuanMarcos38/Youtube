name: Confirm Google OAuth Client ID

on:
  push:
    branches: [ops/copy-google-oauth-to-meta-ads]

permissions:
  contents: read

jobs:
  confirm-client-id:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EASYPANEL_URL: https://ke4n49.easypanel.host
      EASYPANEL_API_KEY: ${{ secrets.EASYPANEL_API_KEY }}
      PROJECT_NAME: r2rmarketingdigital
      SOURCE_SERVICE: shortsia
      TARGET_SERVICE: gestaor2r
    steps:
      - name: Confirm active Google OAuth client ID safely
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EASYPANEL_API_KEY:-}"
          for service in "$SOURCE_SERVICE" "$TARGET_SERVICE"; do
            curl -fsS --max-time 30 --get \
              -H "Authorization: Bearer $EASYPANEL_API_KEY" \
              -H "Accept: application/json" \
              --data-urlencode "projectName=$PROJECT_NAME" \
              --data-urlencode "serviceName=$service" \
              "$EASYPANEL_URL/api/inspectAppService" > "/tmp/${service}.json"
          done
          python3 - <<'PY'
          import json, pathlib
          def find_env(node):
              if isinstance(node, dict):
                  if isinstance(node.get('env'), str): return node['env']
                  for v in node.values():
                      f=find_env(v)
                      if f is not None: return f
              elif isinstance(node, list):
                  for v in node:
                      f=find_env(v)
                      if f is not None: return f
              return None
          def vals(text):
              out={}
              for raw in (text or '').splitlines():
                  if '=' not in raw or raw.lstrip().startswith('#'): continue
                  k,v=raw.split('=',1); out[k.strip()]=v.strip()
              return out
          src=vals(find_env(json.loads(pathlib.Path('/tmp/shortsia.json').read_text())) or '')
          dst=vals(find_env(json.loads(pathlib.Path('/tmp/gestaor2r.json').read_text())) or '')
          source_id=src.get('GOOGLE_OAUTH_CLIENT_ID','')
          target_id=dst.get('GOOGLE_ANALYTICS_CLIENT_ID','') or dst.get('GOOGLE_CLIENT_ID','')
          source_secret=src.get('GOOGLE_OAUTH_CLIENT_SECRET','')
          target_secret=dst.get('GOOGLE_ANALYTICS_CLIENT_SECRET','') or dst.get('GOOGLE_CLIENT_SECRET','')
          if not source_id: raise SystemExit('Source Client ID missing')
          print('ACTIVE_GOOGLE_OAUTH_CLIENT_ID='+source_id)
          print('GESTAO_ADS_CLIENT_ID_MATCH=' + ('yes' if source_id == target_id else 'no'))
          print('SOURCE_SECRET_CONFIGURED=' + ('yes' if bool(source_secret) else 'no'))
          print('TARGET_SECRET_CONFIGURED=' + ('yes' if bool(target_secret) else 'no'))
          print('SECRET_MATCH=' + ('yes' if source_secret and source_secret == target_secret else 'no'))
          PY
          rm -f /tmp/shortsia.json /tmp/gestaor2r.json
