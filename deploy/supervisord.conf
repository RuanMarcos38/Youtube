[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:pot-provider]
directory=/app/pot-provider
command=node build/main.js --port 4416
autostart=true
autorestart=true
startsecs=3
startretries=10
priority=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:backend]
directory=/app/backend
command=/opt/venv/bin/python run.py
autostart=true
autorestart=true
startsecs=3
startretries=10
priority=10
environment=PYTHONPATH="/app/backend",PORT="8000",ENVIRONMENT="production"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:worker]
directory=/app/backend
command=/opt/venv/bin/python -m app.worker
autostart=true
autorestart=true
startsecs=3
startretries=10
priority=20
environment=PYTHONPATH="/app/backend",ENVIRONMENT="production"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:frontend]
directory=/app/frontend
command=node server.js
autostart=true
autorestart=true
startsecs=3
startretries=10
priority=30
environment=PORT="3000",HOSTNAME="0.0.0.0",NODE_ENV="production"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
